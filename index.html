<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progetto Settimana 2</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Header 
        con con uno sfondo scuro  (HEADER: #131921)
        A sinistra logo amazon (o scritta)
        Dopo un lungo input text dove scrivere per la ricerca (placeholder = Cerca prodotti,categorie,brand ...)
        Attaccato a destra del input text un bottone con scritto "Cerca"  (PULSANTE CERCA: #FEBD69)
        Staccato a destra del bottone "Cerca" due scritte "Account" e "Ordini"
        Infine a destra scritto "Carrello" con fra parentesi numero 0 e uno sfondo blu piu chiaro del header
        tutto cliccabile quindi è un navbar
    -->
    <header>
        <nav class="amazon-barra">
            <div class="logo"> amazon </div>
            <div class="barra-ricerca">
                <input type="text" placeholder="Cerca prodotti,categorie,brand ..."></input>
                <button type="button">Cerca</button>
            </div>
            <div class="link-nav">
                <a href="javascript:void(0)">Account</a>
                <a href="javascript:void(0)">Ordini</a>
            </div>
            <div class="carrello">
                <a href="javascript:void(0)">Carrello (0)</a>
            </div>
        </nav>
    </header>

    <main>


        <!-- Hero Section 
        con un colore di sfondo che occupa tutta la larghezza del sito e un'altezza di ?px
        Due scritte al centro del hero, una sopra l'altra, centrate sia verticalmente che orizzontalmente
        Scritta grande "Le offerte di oggi" in bianco e in grassetto
        Scritta più piccola sotto "Sconti fino al 70% su elettronica,casa e molto altro" in bianco e normale
    -->
        <section class="hero">

        </section>



        <!-- Section CATEGORIE

        La prima ha un titolo "Categorie" in grassetto.
        Le card sono orizzontali qui.
        Dentro alla prima, sotto, ci sono 4 card con una leggera ombra per staccarle dallo sfondo.
        Ogni card contiene un rettangolo colorato con dentro una scritta della categoria.
        Sotto il colore è bianco e ci sono due scritte:
        1° scritta: categoria in grassetto
        2° scritta: scopri di più colorata cliccabile (non è un link vero sarà javascript.void(0))

        Comportamenti quando ci passo sopra con il mouse (effetto hover):
        - Scopri di più diventa da verde/blu a arancione (vedi colori su discord);
        - Le card sembrano alzarsi, ma in realtà solo leggera ombra sotto e spostamento verso l'alto di 5px
        -->

        <section class="categorie">

        </section>

        <!-- Section PRODOTTI

        La seconda sezione ha un titolo "I più venduti" in grassetto.
        Sotto ci sono 8 card prodotto, disposte in 4 card per fila, con due file.
        Ogni card ha una leggera ombra per staccare dallo sfondo. Le card sono in formato verticale.
        Ogni card contiene:
        - Un'immagine del prodotto (anche un quadrato grigio con scritto il nome generico va bene es. libro, mouse)
        - Nome del prodotto scritto normale e per intero (es. Il libro più venduto dell'anno);
        - Stelle di valutazione (colorate in giallo aranciato e che segna da una stella a 5) e vicino in blu il voto numerico (es. 4.1);
        - Prezzo del prodotto in grassetto e grande in rosso scuro (es. € 89,99)
        - Sotto un bottone cliccabile rettangolare e ellittico quasi in giallo con scritta nera "Aggiungi al carrello"

        Comportamenti quando ci passo sopra con il mouse (effetto hover):
        - Il bottone aggiungi al carrello diventa di un giallo più scuro 
        -->

        <section class="prodotti">

        </section>

    </main>

    <!-- Footer 

        Sfondo uguale all'hero, con scritte bianche.
        Diviso in tre colonne, contenenti tutte scritte cliccabili (non sono link veri, sarà javascript.void(0))
        Titoli delle colonne in grassetto e non cliccabili.
        Elementi invece dell'elenco cliccabili.

        PRIMA COLONNA
        -Chi siamo (grassetto e non cliccabile)

        Lavora con noi , Investitori , Sostenibilità (cliccabili)

        SECONDA COLONNA
        -Aiuto (grassetto e non cliccabile) 

        Centro assistenza , Spedizioni , Resi e rimborsi (cliccabili)

        TERZA COLONNA
        -Connettiti (grassetto e non cliccabile)

        Facebook , Instagram , Youtube (cliccabili)
    
    -->

    <footer>

    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
